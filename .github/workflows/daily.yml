name: Dagsrapport

on:
  schedule:
    # GitHub hoppar ibland över schemalagda körningar (särskilt på hela timmar), så vi försöker
    # var 20:e minut 05–09 UTC. Steget "Dags att köra?" släpper bara igenom första försöket
    # efter 07.00 svensk tid som ännu inte byggt dagens rapport (built.txt på sidan).
    - cron: "7,27,47 5-9 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: dagsrapport
  cancel-in-progress: false

jobs:
  rapport:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Dags att köra?
        id: gate
        run: |
          today=$(TZ=Europe/Stockholm date +%F); hour=$(TZ=Europe/Stockholm date +%H)
          built=$(curl -fsS "https://jsandvall123.github.io/dagsrapport/built.txt" 2>/dev/null || true)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [ "$hour" -lt 7 ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"; echo "Före 07 i Stockholm, väntar."
          elif [ "$built" = "$today" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"; echo "Dagens rapport finns redan."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.12"

      - name: Hämta surf-scaling-state (privat cache)
        if: steps.gate.outputs.run == 'true'
        uses: actions/cache/restore@v4
        with:
          path: state
          key: surf-${{ github.run_id }}
          restore-keys: surf-

      - name: Kampanjkontroll + hämta Juicy + bygg sidan
        if: steps.gate.outputs.run == 'true'
        env:
          JUICY_SE_TOKEN: ${{ secrets.JUICY_SE_TOKEN }}
          JUICY_DK_TOKEN: ${{ secrets.JUICY_DK_TOKEN }}
          JUICY_NO_TOKEN: ${{ secrets.JUICY_NO_TOKEN }}
          JUICY_FI_TOKEN: ${{ secrets.JUICY_FI_TOKEN }}
          JUICY_DE_TOKEN: ${{ secrets.JUICY_DE_TOKEN }}
          JUICY_HOMELYST_TOKEN: ${{ secrets.JUICY_HOMELYST_TOKEN }}
          JUICY_HUSTOVALD_TOKEN: ${{ secrets.JUICY_HUSTOVALD_TOKEN }}
          JUICY_JUNO_TOKEN: ${{ secrets.JUICY_JUNO_TOKEN }}
          JUICY_EARLO_TOKEN: ${{ secrets.JUICY_EARLO_TOKEN }}
          META_BUDGET_TOKEN: ${{ secrets.META_BUDGET_TOKEN }}
        run: python build.py

      - name: Spara surf-scaling-state
        if: steps.gate.outputs.run == 'true' && always()
        uses: actions/cache/save@v4
        with:
          path: state
          key: surf-${{ github.run_id }}

      - name: Lösenordsskydda sidan
        if: steps.gate.outputs.run == 'true'
        env:
          PW: ${{ secrets.DAGSRAPPORT_PASSWORD }}
          SALT: ${{ secrets.DAGSRAPPORT_SALT }}
        run: |
          npx -y staticrypt@3.5.4 site/index.html -d site -p "$PW" --salt "$SALT" --config false --short \
            --remember 365 --template-title "Dagsrapport" --template-instructions "Skriv lösenordet" \
            --template-placeholder "Lösenord" --template-button "Öppna" --template-remember "Kom ihåg mig" \
            --template-error "Fel lösenord" --template-color-primary "#1baf7a" --template-color-secondary "#f6f5f2"
          grep -q "staticrypt" site/index.html
          TZ=Europe/Stockholm date +%F > site/built.txt

      - uses: actions/configure-pages@v5
        if: steps.gate.outputs.run == 'true'

      - uses: actions/upload-pages-artifact@v3
        if: steps.gate.outputs.run == 'true'
        with:
          path: site

      - name: Publicera
        id: deploy
        if: steps.gate.outputs.run == 'true'
        uses: actions/deploy-pages@v4

      - name: Larma om något gick fel (GitHub mejlar då)
        if: steps.gate.outputs.run == 'true'
        run: |
          if [ -f errors.txt ]; then cat errors.txt; exit 1; fi
