<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Dagsrapport</title>
<style>
:root{--bg:#ffffff;--surface:#f6f5f2;--text:#0b0b0b;--text2:#52514e;--muted:#898781;--border:rgba(11,11,11,.10);--strong:rgba(11,11,11,.35);--ok:#0f7a4f;--bad:#c23b3a;--warn-bg:#fdf3dc;--warn:#7a5208;--bad-bg:#fbeaea}
@media (prefers-color-scheme: dark){:root{--bg:#141413;--surface:#1f1f1d;--text:#f0efec;--text2:#c3c2b7;--muted:#898781;--border:rgba(255,255,255,.10);--strong:rgba(255,255,255,.35);--ok:#3ccf91;--bad:#ff7b7a;--warn-bg:#3a2e14;--warn:#f3c76b;--bad-bg:#3b1d1d}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums}
main{max-width:860px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:20px;font-weight:600;margin:0}
.meta{font-size:13px;color:var(--muted);margin:2px 0 16px}
.row{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.row button{font:inherit;font-size:14px;padding:7px 14px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--text);cursor:pointer}
.row.idle{align-items:center;margin-top:-4px}.row.idle button{font-size:13px;padding:5px 11px;color:var(--muted)}.row.idle button.on{color:var(--text)}.idl{font-size:12px;color:var(--muted);margin-right:2px}
.row button.on{background:var(--surface);border-color:var(--strong);font-weight:600}
.sec{font-size:13px;color:var(--text2);margin:28px 0 8px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.k{background:var(--surface);border-radius:8px;padding:12px 14px}.k p{margin:0}
.kl{font-size:12px;color:var(--text2)}.kv{font-size:22px;font-weight:600}.ks{font-size:12px;color:var(--muted)}
.lg{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--text2);margin:24px 0 8px}
.lg span{display:flex;align-items:center;gap:5px}.sq{width:10px;height:10px;border-radius:2px;display:inline-block}.ln{width:16px;border-top:2px solid;display:inline-block}
.chart{position:relative;height:320px}
table{width:100%;border-collapse:collapse;font-size:14px;table-layout:fixed}
th{font-weight:400;color:var(--muted);font-size:12px;text-align:right;padding:6px 4px;border-bottom:1px solid var(--border)}
td{text-align:right;padding:8px 4px;border-bottom:1px solid var(--border);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
.pos{color:var(--ok)}.neg{color:var(--bad)}.dim{color:var(--muted)}
summary{cursor:pointer}.box{border-radius:8px;padding:10px 14px;font-size:13px;margin:0 0 14px}
.box.warn{background:var(--warn-bg);color:var(--warn)}.box.bad{background:var(--bad-bg);color:var(--bad)}
.box ul{margin:4px 0 0;padding-left:18px}
.foot{font-size:12px;color:var(--muted);margin-top:10px}
@media (max-width:600px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.chart{height:260px}.hide-sm{display:none}table{font-size:13px;table-layout:auto}td:first-child{max-width:130px}}
button.kr{margin-left:6px;font:inherit;font-size:11px;line-height:1;padding:2px 5px;border:1px solid var(--border);border-radius:5px;background:transparent;color:var(--muted);cursor:pointer}button.kr:hover{color:var(--text);border-color:var(--strong)}
th.sortable{cursor:pointer;user-select:none}th.sortable:hover{color:var(--text)}
table.camps td:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
</style>
</head>
<body>
<main>
<h1>Dagsrapport</h1>
<p class="meta" id="meta"></p>
<div id="alerts"></div>
<div class="row" id="st"></div>
<div class="row idle" id="st2"></div>
<div class="row" id="tb"></div>

<p class="sec" id="sumh">Sammanfattning</p>
<div class="kpis" id="sum"></div>

<div class="lg"><span><i class="sq" style="background:rgba(136,135,128,.35)"></i><i class="ln" id="lgR"></i>Omsättning</span><span><i class="sq" style="background:rgba(42,120,214,.35)"></i><i class="ln" style="border-color:#2a78d6"></i>Annonskostnad</span><span><i class="sq" style="background:#1baf7a"></i><i class="ln" style="border-color:#1baf7a"></i>Vinst</span><span><i class="sq" style="background:#e34948"></i>Förlust</span></div>
<div class="chart"><canvas id="ch" role="img" aria-label="Omsättning, annonskostnad och vinst per dag för vald butik och period"></canvas></div>

<div id="prod"></div>
<div id="camps"></div>
<div id="surf"></div>
<div id="daily"></div>
<div id="split"></div>

<p class="sec">Topp 5 annonser efter spend</p>
<table><colgroup><col style="width:34%"><col><col class="hide-sm"><col><col><col></colgroup>
<thead><tr><th>Annonsnamn</th><th>Spend</th><th class="hide-sm">Andel</th><th>Oms.</th><th>ROAS</th><th>Vinst</th></tr></thead><tbody id="tbody"></tbody></table>
<p class="foot" id="foot"></p>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
const DATA=/*DATA*/null;
const D=DATA.stores,codes=DATA.order,L=DATA.labels,PER=DATA.periods;
const NAME={ALLA:'Alla'};codes.forEach(c=>NAME[c]=D[c].name);
D.ALLA={R:L.map((_,i)=>codes.reduce((a,c)=>a+D[c].R[i],0)),S:L.map((_,i)=>codes.reduce((a,c)=>a+D[c].S[i],0)),P:L.map((_,i)=>codes.reduce((a,c)=>a+D[c].P[i],0)),top:{}};
Object.keys(PER).forEach(p=>D.ALLA.top[p]=codes.flatMap(c=>D[c].top[p]).sort((a,b)=>b[1]-a[1]).slice(0,5));

const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
document.getElementById('meta').textContent='Uppdaterad '+DATA.generated+' · uppdateras var 15:e minut · alla belopp i SEK från Juicy';
let al='';
if(DATA.errors.length)al+=`<div class="box bad"><b>Något gick fel i körningen</b><ul>${DATA.errors.map(e=>'<li>'+esc(e)+'</li>').join('')}</ul></div>`;
if(DATA.missing.length)al+=`<div class="box warn">Saknar Juicy-nyckel: ${esc(DATA.missing.join(', '))}</div>`;
if(DATA.sync.changes.length)al+=`<details class="box warn"><summary><b>Kampanjkontrollen rättade ${DATA.sync.changes.length} kampanjer</b> · se vilka</summary><ul>${DATA.sync.changes.map(c=>`<li>${esc(NAME[c.store]||c.store)}: ${esc(c.campaign)} → ${esc(c.action)}</li>`).join('')}</ul></details>`;
if(DATA.sync.new.length)al+=`<details class="box warn"><summary><b>${DATA.sync.new.length} nya kampanjer</b> · kolla att butiken stämmer</summary><ul>${DATA.sync.new.map(c=>`<li>${esc(c.date)} · ${esc(c.name)} → ${esc(NAME[c.store]||c.store)}</li>`).join('')}</ul></details>`;
document.getElementById('alerts').innerHTML=al;

const dark=matchMedia('(prefers-color-scheme: dark)').matches;
const g=dark?'#2c2c2a':'#e1e0d9',mu='#898781',ring=dark?'#141413':'#ffffff',blk=dark?'#f0efec':'#0b0b0b',GR='#1baf7a',RD='#e34948';
document.getElementById('lgR').style.borderColor=blk;
const f=v=>(v<0?'−':'')+Math.abs(Math.round(v)).toLocaleString('sv-SE');
const pc=v=>isFinite(v)?(v<0?'−':'')+Math.abs(v).toFixed(1).replace('.',',')+' %':'–';
const ro=(r,s)=>s?(r/s).toFixed(2).replace('.',','):'–';
const cls=v=>v<0?'neg':'pos',sg=v=>v>0?'+':'';
const LINE=[blk,'#2a78d6',GR];
const topLines={id:'topLines',afterDatasetsDraw(c){const x=c.ctx;[0,1,2].forEach(i=>{const m=c.getDatasetMeta(i);if(m.hidden||m.data.length<2)return;const pts=m.data.map(e=>({x:e.x,y:e.y}));x.save();x.strokeStyle=LINE[i];x.lineWidth=2.5;x.lineJoin='round';x.lineCap='round';const T=c.$today??-1,n=T>0?T:pts.length;x.beginPath();pts.slice(0,n).forEach((p,j)=>j?x.lineTo(p.x,p.y):x.moveTo(p.x,p.y));x.stroke();if(T>0){x.save();x.setLineDash([5,5]);x.globalAlpha=.6;x.beginPath();x.moveTo(pts[T-1].x,pts[T-1].y);x.lineTo(pts[T].x,pts[T].y);x.stroke();x.restore()}pts.forEach((p,j)=>{const v=c.data.datasets[i].data[j];x.beginPath();x.arc(p.x,p.y,4.5,0,7);x.fillStyle=i===2&&v<0?RD:LINE[i];x.fill();x.lineWidth=2;x.strokeStyle=ring;x.stroke()});x.restore()})}};
const br=(lab,c)=>({type:'bar',label:lab,data:[],backgroundColor:c,borderRadius:4,maxBarThickness:22});
const chart=new Chart(document.getElementById('ch'),{data:{labels:[],datasets:[br('Omsättning','rgba(136,135,128,.35)'),br('Annonskostnad','rgba(42,120,214,.35)'),br('Vinst',GR)]},plugins:[topLines],
options:{responsive:true,maintainAspectRatio:false,layout:{padding:{top:8}},interaction:{mode:'index',intersect:false},plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>c.dataset.label+': '+f(c.raw)+' kr'}}},scales:{x:{grid:{display:false},ticks:{color:mu}},y:{beginAtZero:true,grid:{color:g},ticks:{color:mu,callback:v=>f(v)}}}}});

let store='ALLA',per='Idag',SS={k:'P',d:1};try{const x=JSON.parse(localStorage.getItem('splitSort'));if(x&&x.k)SS=x}catch(e){}
try{store=localStorage.getItem('store')||store;per=localStorage.getItem('per')||per}catch(e){}
if(!D[store])store='ALLA';if(!PER[per])per='Idag';
const rng=x=>x.slice(PER[per].from,PER[per].to+1);
const sum=x=>rng(x).reduce((q,w)=>q+w,0);
const st=document.getElementById('st'),tb=document.getElementById('tb');
document.addEventListener('click',ev=>{const k0=ev.target.closest('#split button.kr');if(k0){const c=k0.parentNode;if(!c.dataset.p){c.dataset.p=c.innerHTML;c.innerHTML=`${k0.dataset.kr}<button class="kr" title="Visa i procent">%</button>`}else{c.innerHTML=c.dataset.p;delete c.dataset.p}return}const h=ev.target.closest('#split th[data-sort]');if(!h)return;const k=h.dataset.sort;SS=SS.k===k?{k,d:-SS.d}:{k,d:1};try{localStorage.setItem('splitSort',JSON.stringify(SS))}catch(e){}render()});
function spark(vals,ti){
  const n=vals.length,m=Math.max(1,...vals.map(Math.abs)),W=100,H=30,mid=H/2,bw=Math.min(10,W/n*0.6);
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="width:100%;height:30px;display:block" aria-hidden="true"><line x1="0" x2="${W}" y1="${mid}" y2="${mid}" stroke="var(--border)" stroke-width="1" vector-effect="non-scaling-stroke"/>`+
    vals.map((v,i)=>{const h=Math.max(v?1.5:0,Math.abs(v)/m*(mid-1)),x=(i+.5)*W/n-bw/2;return `<rect x="${x.toFixed(2)}" y="${(v<0?mid:mid-h).toFixed(2)}" width="${bw.toFixed(2)}" height="${h.toFixed(2)}" rx="1" fill="${v<0?RD:GR}" opacity="${i===ti?.4:1}"><title>${esc(String(L[PER[per].from+i]||''))}: ${sg(v)}${f(v)} kr</title></rect>`}).join('')+'</svg>';
}
function renderCamps(){
  const el=document.getElementById('camps'),C=D[store]&&D[store].camps;
  if(!C){el.innerHTML='';return}
  const one=PER[per].from===PER[per].to,withToday=!one&&PER[per].to===L.length-2;
  const grf=x=>withToday?x.slice(PER[per].from,PER[per].to+2):rng(x);
  const rows=Object.entries(C).map(([n,c])=>({n,S:sum(c.S),R:sum(c.R),P:sum(c.P),d:grf(c.P)})).filter(x=>x.S||x.R).sort((a,b)=>b.S-a.S);
  if(!rows.length){el.innerHTML='';return}
  const ti=withToday?rows[0].d.length-1:-1;
  el.innerHTML='<p class="sec">Per kampanj · '+esc(PER[per].label)+'</p><table class="camps"><colgroup><col style="width:34%"><col><col class="hide-sm"><col><col><col style="width:22%"></colgroup><thead><tr><th>Kampanj</th><th>Spend</th><th class="hide-sm">Oms.</th><th>ROAS</th><th>Vinst</th><th>'+(one?'':'Vinst per dag')+'</th></tr></thead><tbody>'+
    rows.map(x=>`<tr><td title="${esc(x.n)}">${esc(x.n)}</td><td>${f(x.S)}</td><td class="hide-sm">${f(x.R)}</td><td>${ro(x.R,x.S)}</td><td class="${cls(x.P)}">${sg(x.P)}${f(x.P)}</td><td>${one?'':spark(x.d,ti)}</td></tr>`).join('')+
    '</tbody></table><p class="dim" style="font-size:12px;margin:4px 0 0">Vinst efter annonskostnad per annons i Juicy (utan fasta kostnader).'+(withToday?' Tonad stapel = idag hittills, räknas inte i summorna.':'')+'</p>';
}
function renderProd(){
  const el=document.getElementById('prod'),P=D[store]&&D[store].products;
  if(!P){el.innerHTML='';return}
  const one=PER[per].from===PER[per].to;
  const tot=lands=>{const t={R:0,S:0,P:0,d:rng(L).map(()=>0)};Object.values(lands).forEach(x=>{t.R+=sum(x.R);t.S+=sum(x.S);t.P+=sum(x.P);rng(x.P).forEach((v,i)=>t.d[i]+=v)});return t};
  const prods=Object.entries(P).map(([n,l])=>[n,l,tot(l)]).filter(x=>x[2].S||x[2].R).sort((a,b)=>b[2].S-a[2].S);
  const row=(name,t,sub)=>`<tr${sub?' class="dim"':''}><td style="${sub?'padding-left:18px':''}">${sub?esc(name):'<b>'+esc(name)+'</b>'}</td><td>${f(t.R)}</td><td>${f(t.S)}</td><td>${ro(t.R,t.S)}</td><td class="${cls(t.P)}">${sg(t.P)}${f(t.P)}</td></tr>`;
  let h='<p class="sec">Per produkt · '+esc(PER[per].label)+'</p><table><colgroup><col style="width:34%"><col><col><col><col></colgroup><thead><tr><th>Produkt / land</th><th>Oms.</th><th>Spend</th><th>ROAS</th><th>Vinst</th></tr></thead><tbody>';
  prods.forEach(([n,l,t])=>{h+=row(n,t,false);Object.entries(l).map(([k,x])=>[k,{R:sum(x.R),S:sum(x.S),P:sum(x.P)}]).filter(x=>x[1].S||x[1].R).sort((a,b)=>b[1].S-a[1].S).forEach(([k,x])=>h+=row(k,x,true))});
  h+='</tbody></table><p class="dim" style="font-size:12px;margin:4px 0 0">Vinst efter annonskostnad per annons i Juicy. Summan blir inte exakt butikens vinst (fasta kostnader och köp utan annons räknas inte).</p>';
  if(!one)h+='<p class="sec">Vinst per dag per produkt</p><table><thead><tr><th>Produkt</th>'+rng(L).map(l=>'<th>'+esc(l)+'</th>').join('')+'</tr></thead><tbody>'+prods.map(([n,l,t])=>'<tr><td>'+esc(n)+'</td>'+t.d.map(v=>`<td class="${cls(v)}">${sg(v)}${f(v)}</td>`).join('')+'</tr>').join('')+'</tbody></table>';
  el.innerHTML=h;
}
function renderSurf(){
  const el=document.getElementById('surf'),S=DATA.surf,I=S&&S.stores&&S.stores[store];
  if(!I){el.innerHTML='';return}
  const ent=S.ent.filter(e=>e.store===store),log=S.log.filter(l=>l.store===store);
  const n2=x=>x!=null?x.toFixed(2).replace('.',','):'–';
  const dec=a=>a.startsWith('höj')?'pos':a==='fel'||a.startsWith('sänk')?'neg':a==='håll'?'':'dim';
  el.innerHTML=`<p class="sec">Surf-scaling · ${S.test?'<b>TEST</b>, ändrar ingenting i Meta':'<b class="pos">LIVE</b>, ändrar budgetar i Meta'}</p>
  <div class="box warn">Mätning från kl ${esc(I.snap||'07')}. Kl 09, 12, 15, 18, 21: höj +50 % (+25 % när budgeten är minst ${f(S.highFrom)} kr) om ROAS sedan dess <i>och</i> sedan förra kontrollen ≥ <b>${n2(I.limit)}</b> (${String(S.margin).replace('.',',')} × break-even ${n2(I.be)}) och spend ≥ ${S.minSpend} kr. Sänk −25 % (aldrig under original) om ROAS sedan förra kontrollen är under break-even. Tak ${S.maxMult} × originalbudget. Återställning 23:30. Nästa: <b>${esc(S.next)}</b>.</div>
  <table><colgroup><col style="width:40%"><col class="hide-sm"><col><col><col></colgroup><thead><tr><th>Kampanj / annonsuppsättning</th><th class="hide-sm">Nivå</th><th>Original</th><th>${S.test?'Skulle vara nu':'Nu'}</th><th>Höj / sänk</th></tr></thead><tbody>${ent.length?ent.map(e=>`<tr><td title="${esc(e.name)}">${esc(e.name)}</td><td class="hide-sm dim">${esc(e.level)}</td><td>${f(e.base)}${e.mult&&e.mult!==S.maxMult?' <span class="dim">(tak '+e.mult+'x)</span>':''}</td><td class="${e.steps?'pos':''}">${f(e.sim)}</td><td>${e.steps}${e.downs?' / <span class="neg">−'+e.downs+'</span>':''}</td></tr>`).join(''):'<tr><td colspan="5" class="dim">Inga aktiva kampanjer</td></tr>'}</tbody></table>
  <p class="sec">Beslut i dag</p>
  <table><colgroup><col style="width:12%"><col style="width:38%"><col style="width:16%"><col></colgroup><thead><tr><th>Tid</th><th>Kampanj</th><th>Beslut</th><th>Varför</th></tr></thead><tbody>${log.length?log.slice().reverse().map(l=>`<tr><td>${esc(l.t)}</td><td title="${esc(l.name)}">${esc(l.name)}</td><td class="${dec(l.act)}">${esc(l.act)}</td><td class="dim" style="white-space:normal">${esc(l.why)}</td></tr>`).join(''):'<tr><td colspan="4" class="dim">Inga kontroller än i dag</td></tr>'}</tbody></table>`;
}
function render(){
  try{localStorage.setItem('store',store);localStorage.setItem('per',per)}catch(e){}
  [...st.children,...st2.children].forEach(b=>b.classList.toggle('on',b.dataset.k===store));[...tb.children].forEach(b=>b.classList.toggle('on',b.textContent===per));
  const d=D[store],one=PER[per].from===PER[per].to,pp=rng(d.P);
  // 4/7 dagar: hela dagar + en extra stapel för idag (hittills). Sammanfattning och tabeller räknar bara hela dagar.
  const withToday=!one&&PER[per].to===L.length-2,grf=x=>withToday?x.slice(PER[per].from,PER[per].to+2):rng(x);
  const gp=grf(d.P),ti=withToday?gp.length-1:-1,dim=(c,i)=>i===ti?c.replace(/[\d.]+\)$/,m=>(parseFloat(m)/2.2).toFixed(2)+')'):c;
  chart.$today=ti;chart.data.labels=grf(L).map((l,i)=>i===ti?[l,'hittills']:l);
  chart.data.datasets[0].data=grf(d.R);chart.data.datasets[1].data=grf(d.S);chart.data.datasets[2].data=gp;
  chart.data.datasets[0].backgroundColor=gp.map((_,i)=>dim('rgba(136,135,128,.35)',i));chart.data.datasets[1].backgroundColor=gp.map((_,i)=>dim('rgba(42,120,214,.35)',i));
  chart.data.datasets[2].backgroundColor=gp.map((v,i)=>i===ti?(v<0?'rgba(227,73,72,.45)':'rgba(27,175,122,.45)'):(v<0?RD:GR));chart.data.datasets.forEach(x=>x.maxBarThickness=one?48:22);chart.update();
  const r=sum(d.R),sp=sum(d.S),pr=sum(d.P);
  const days=rng(L).map((l,i)=>({l,R:rng(d.R)[i],S:rng(d.S)[i],P:pp[i]})).reverse();
  document.getElementById('daily').innerHTML=one?'':'<p class="sec">Vinst per dag · '+esc(NAME[store])+'</p><table><colgroup><col style="width:22%"><col><col><col><col><col class="hide-sm"></colgroup><thead><tr><th>Dag</th><th>Oms.</th><th>Spend</th><th>ROAS</th><th>Vinst</th><th class="hide-sm">Vinst %</th></tr></thead><tbody>'+days.map(x=>`<tr><td>${esc(x.l)}</td><td>${f(x.R)}</td><td>${f(x.S)}</td><td>${ro(x.R,x.S)}</td><td class="${cls(x.P)}">${sg(x.P)}${f(x.P)}</td><td class="${cls(x.P)} hide-sm">${pc(x.P/x.R*100)}</td></tr>`).join('')+`<tr><td><b>Totalt</b></td><td><b>${f(r)}</b></td><td><b>${f(sp)}</b></td><td><b>${ro(r,sp)}</b></td><td class="${cls(pr)}"><b>${sg(pr)}${f(pr)}</b></td><td class="${cls(pr)} hide-sm"><b>${pc(pr/r*100)}</b></td></tr></tbody></table>`;
  document.getElementById('sumh').textContent='Sammanfattning · '+NAME[store]+' · '+PER[per].label;
  document.getElementById('sum').innerHTML=`<div class="k"><p class="kl">Vinst</p><p class="kv ${cls(pr)}">${sg(pr)}${f(pr)} kr</p><p class="ks">${pc(pr/r*100)} av oms.</p></div><div class="k"><p class="kl">Omsättning</p><p class="kv">${f(r)}</p></div><div class="k"><p class="kl">Annonskostnad</p><p class="kv">${f(sp)}</p></div><div class="k"><p class="kl">ROAS</p><p class="kv">${ro(r,sp)}</p></div>`;
  const cg=(R,C)=>R>0&&!C?'<span class="neg" title="Ingen COGS trots försäljning – kolla produktkostnaden i Juicy">0 ⚠</span>':R?`${pc(C/R*100)}<button class="kr" data-kr="${f(C)} kr" title="Visa i kronor">kr</button>`:'–';
  if(store!=='ALLA'){document.getElementById('split').innerHTML='';}else{
  const rows=codes.map(c=>{const R=sum(D[c].R),S=sum(D[c].S),P=sum(D[c].P),C=D[c].C?sum(D[c].C):0;return {c,R,S,C,P,cp:R?C/R:-1,ro:S?R/S:-1,pp:R?P/R:-1e9}});
  rows.sort((a,b)=>(b[SS.k]-a[SS.k])*SS.d||b.P-a.P);
  const th=(k,t,x)=>`<th data-sort="${k}" class="sortable${x?' '+x:''}" title="Sortera">${t}${SS.k===k?(SS.d>0?' ↓':' ↑'):''}</th>`;
  document.getElementById('split').innerHTML='<p class="sec">Per butik · '+PER[per].label+'</p><table><colgroup><col style="width:22%"><col><col><col><col><col><col class="hide-sm"></colgroup><thead><tr><th>Butik</th>'+th('R','Oms.')+th('S','Spend')+th('cp','COGS')+th('ro','ROAS')+th('P','Vinst')+th('pp','Vinst %','hide-sm')+'</tr></thead><tbody>'+rows.map(({c,R,S,C,P})=>`<tr><td>${esc(NAME[c])}</td><td>${f(R)}</td><td>${f(S)}</td><td>${cg(R,C)}</td><td>${ro(R,S)}</td><td class="${cls(P)}">${sg(P)}${f(P)}</td><td class="${cls(P)} hide-sm">${pc(P/R*100)}</td></tr>`).join('')+'</tbody></table><p class="dim" style="font-size:12px;margin:4px 0 0">Klicka på en rubrik för att sortera, klicka igen för att vända.</p>';}
  renderProd();renderCamps();renderSurf();
  const rows=d.top[per]||[];
  document.getElementById('tbody').innerHTML=rows.map(x=>`<tr><td title="${esc(x[0])}">${esc(x[0])}</td><td>${f(x[1])}</td><td class="hide-sm">${sp?Math.round(x[1]/sp*100):0} %</td><td>${f(x[2])}</td><td>${ro(x[2],x[1])}</td><td class="${cls(x[3])}">${sg(x[3])}${f(x[3])}</td></tr>`).join('')+(rows.length?`<tr><td class="dim">Topp 5 av total</td><td colspan="5" class="dim">${sp?Math.round(rows.reduce((q,x)=>q+x[1],0)/sp*100):0} % av ${f(sp)} kr</td></tr>`:'<tr><td colspan="6" class="dim">Ingen annonsspend i perioden</td></tr>');
  document.getElementById('foot').textContent='DKK, NOK och EUR omräknade med Riksbankens dagskurs. Omsättning = nettoomsättning. Vinst per annons = Juicys bruttovinst minus spend (före transaktionsavgifter). Annonsnamn exakt som i Meta.';
}
// aktiv = spend i dag eller i går; övriga i en dämpad rad under
const st2=document.getElementById('st2'),active=c=>D[c].S[6]>0||D[c].S[7]>0;
const btn=(k,el)=>{const b=document.createElement('button');b.textContent=NAME[k];b.dataset.k=k;b.onclick=()=>{store=k;render()};el.appendChild(b)};
['ALLA',...codes.filter(active)].forEach(k=>btn(k,st));
const idle=codes.filter(c=>!active(c));
if(idle.length){const l=document.createElement('span');l.className='idl';l.textContent='Ingen spend i dag/i går:';st2.appendChild(l);idle.forEach(k=>btn(k,st2))}
Object.keys(PER).forEach(k=>{const b=document.createElement('button');b.textContent=k;b.onclick=()=>{per=k;render()};tb.appendChild(b)});
render();
</script>
</body>
</html>
