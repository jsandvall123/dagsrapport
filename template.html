<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Dagsrapport</title>
<style>
:root{--bg:#ffffff;--surface:#f6f5f2;--text:#0b0b0b;--text2:#52514e;--muted:#898781;--border:rgba(11,11,11,.10);--strong:rgba(11,11,11,.35);--ok:#0f7a4f;--bad:#c23b3a;--warn-bg:#fdf3dc;--warn:#7a5208;--bad-bg:#fbeaea}
@media (prefers-color-scheme: dark){:root{--bg:#141413;--surface:#1f1f1d;--text:#f0efec;--text2:#c3c2b7;--muted:#898781;--border:rgba(255,255,255,.10);--strong:rgba(255,255,255,.35);--ok:#3ccf91;--bad:#ff7b7a;--warn-bg:#3a2e14;--warn:#f3c76b;--bad-bg:#3b1d1d}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums}
main{max-width:860px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:20px;font-weight:600;margin:0}
.meta{font-size:13px;color:var(--muted);margin:2px 0 16px}
.row{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.row button{font:inherit;font-size:14px;padding:7px 14px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--text);cursor:pointer}
.row button.on{background:var(--surface);border-color:var(--strong);font-weight:600}
.sec{font-size:13px;color:var(--text2);margin:28px 0 8px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.k{background:var(--surface);border-radius:8px;padding:12px 14px}.k p{margin:0}
.kl{font-size:12px;color:var(--text2)}.kv{font-size:22px;font-weight:600}.ks{font-size:12px;color:var(--muted)}
.lg{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--text2);margin:24px 0 8px}
.lg span{display:flex;align-items:center;gap:5px}.sq{width:10px;height:10px;border-radius:2px;display:inline-block}.ln{width:16px;border-top:2px solid;display:inline-block}
.chart{position:relative;height:320px}
table{width:100%;border-collapse:collapse;font-size:14px;table-layout:fixed}
th{font-weight:400;color:var(--muted);font-size:12px;text-align:right;padding:6px 4px;border-bottom:1px solid var(--border)}
td{text-align:right;padding:8px 4px;border-bottom:1px solid var(--border);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
.pos{color:var(--ok)}.neg{color:var(--bad)}.dim{color:var(--muted)}
summary{cursor:pointer}.box{border-radius:8px;padding:10px 14px;font-size:13px;margin:0 0 14px}
.box.warn{background:var(--warn-bg);color:var(--warn)}.box.bad{background:var(--bad-bg);color:var(--bad)}
.box ul{margin:4px 0 0;padding-left:18px}
.foot{font-size:12px;color:var(--muted);margin-top:10px}
@media (max-width:600px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.chart{height:260px}.hide-sm{display:none}table{font-size:13px;table-layout:auto}td:first-child{max-width:130px}}
</style>
</head>
<body>
<main>
<h1>Dagsrapport</h1>
<p class="meta" id="meta"></p>
<div id="alerts"></div>
<div class="row" id="st"></div>
<div class="row" id="tb"></div>

<p class="sec" id="sumh">Sammanfattning</p>
<div class="kpis" id="sum"></div>

<div class="lg"><span><i class="sq" style="background:rgba(136,135,128,.35)"></i><i class="ln" id="lgR"></i>Omsättning</span><span><i class="sq" style="background:rgba(42,120,214,.35)"></i><i class="ln" style="border-color:#2a78d6"></i>Annonskostnad</span><span><i class="sq" style="background:#1baf7a"></i><i class="ln" style="border-color:#1baf7a"></i>Vinst</span><span><i class="sq" style="background:#e34948"></i>Förlust</span></div>
<div class="chart"><canvas id="ch" role="img" aria-label="Omsättning, annonskostnad och vinst per dag för vald butik och period"></canvas></div>

<div id="split"></div>

<p class="sec">Topp 5 annonser efter spend</p>
<table><colgroup><col style="width:34%"><col><col class="hide-sm"><col><col><col></colgroup>
<thead><tr><th>Annonsnamn</th><th>Spend</th><th class="hide-sm">Andel</th><th>Oms.</th><th>ROAS</th><th>Vinst</th></tr></thead><tbody id="tbody"></tbody></table>
<p class="foot" id="foot"></p>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
const DATA=/*DATA*/null;
const D=DATA.stores,codes=DATA.order,L=DATA.labels,PER=DATA.periods;
const NAME={ALLA:'Alla'};codes.forEach(c=>NAME[c]=D[c].name);
D.ALLA={R:L.map((_,i)=>codes.reduce((a,c)=>a+D[c].R[i],0)),S:L.map((_,i)=>codes.reduce((a,c)=>a+D[c].S[i],0)),P:L.map((_,i)=>codes.reduce((a,c)=>a+D[c].P[i],0)),top:{}};
Object.keys(PER).forEach(p=>D.ALLA.top[p]=codes.flatMap(c=>D[c].top[p]).sort((a,b)=>b[1]-a[1]).slice(0,5));

const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
document.getElementById('meta').textContent='Uppdaterad '+DATA.generated+' · alla belopp i SEK från Juicy';
let al='';
if(DATA.errors.length)al+=`<div class="box bad"><b>Något gick fel i körningen</b><ul>${DATA.errors.map(e=>'<li>'+esc(e)+'</li>').join('')}</ul></div>`;
if(DATA.missing.length)al+=`<div class="box warn">Saknar Juicy-nyckel: ${esc(DATA.missing.join(', '))}</div>`;
if(DATA.sync.changes.length)al+=`<div class="box warn"><b>Kampanjkontrollen rättade ${DATA.sync.changes.length} kampanjer</b><ul>${DATA.sync.changes.map(c=>`<li>${esc(NAME[c.store]||c.store)}: ${esc(c.campaign)} → ${esc(c.action)}</li>`).join('')}</ul></div>`;
if(DATA.sync.new.length)al+=`<details class="box warn"><summary><b>${DATA.sync.new.length} nya kampanjer</b> · kolla att butiken stämmer</summary><ul>${DATA.sync.new.map(c=>`<li>${esc(c.date)} · ${esc(c.name)} → ${esc(NAME[c.store]||c.store)}</li>`).join('')}</ul></details>`;
document.getElementById('alerts').innerHTML=al;

const dark=matchMedia('(prefers-color-scheme: dark)').matches;
const g=dark?'#2c2c2a':'#e1e0d9',mu='#898781',ring=dark?'#141413':'#ffffff',blk=dark?'#f0efec':'#0b0b0b',GR='#1baf7a',RD='#e34948';
document.getElementById('lgR').style.borderColor=blk;
const f=v=>(v<0?'−':'')+Math.abs(Math.round(v)).toLocaleString('sv-SE');
const pc=v=>isFinite(v)?v.toFixed(1).replace('.',',')+' %':'–';
const ro=(r,s)=>s?(r/s).toFixed(2).replace('.',','):'–';
const cls=v=>v<0?'neg':'pos',sg=v=>v>0?'+':'';
const LINE=[blk,'#2a78d6',GR];
const topLines={id:'topLines',afterDatasetsDraw(c){const x=c.ctx;[0,1,2].forEach(i=>{const m=c.getDatasetMeta(i);if(m.hidden||m.data.length<2)return;const pts=m.data.map(e=>({x:e.x,y:e.y}));x.save();x.strokeStyle=LINE[i];x.lineWidth=2.5;x.lineJoin='round';x.lineCap='round';x.beginPath();pts.forEach((p,j)=>j?x.lineTo(p.x,p.y):x.moveTo(p.x,p.y));x.stroke();pts.forEach((p,j)=>{const v=c.data.datasets[i].data[j];x.beginPath();x.arc(p.x,p.y,4.5,0,7);x.fillStyle=i===2&&v<0?RD:LINE[i];x.fill();x.lineWidth=2;x.strokeStyle=ring;x.stroke()});x.restore()})}};
const br=(lab,c)=>({type:'bar',label:lab,data:[],backgroundColor:c,borderRadius:4,maxBarThickness:22});
const chart=new Chart(document.getElementById('ch'),{data:{labels:[],datasets:[br('Omsättning','rgba(136,135,128,.35)'),br('Annonskostnad','rgba(42,120,214,.35)'),br('Vinst',GR)]},plugins:[topLines],
options:{responsive:true,maintainAspectRatio:false,layout:{padding:{top:8}},interaction:{mode:'index',intersect:false},plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>c.dataset.label+': '+f(c.raw)+' kr'}}},scales:{x:{grid:{display:false},ticks:{color:mu}},y:{beginAtZero:true,grid:{color:g},ticks:{color:mu,callback:v=>f(v)}}}}});

let store='ALLA',per='7 dagar';
try{store=localStorage.getItem('store')||store;per=localStorage.getItem('per')||per}catch(e){}
if(!D[store])store='ALLA';if(!PER[per])per='7 dagar';
const sum=(x,a)=>x.slice(a).reduce((q,w)=>q+w,0);
const st=document.getElementById('st'),tb=document.getElementById('tb');
function render(){
  try{localStorage.setItem('store',store);localStorage.setItem('per',per)}catch(e){}
  [...st.children].forEach(b=>b.classList.toggle('on',b.dataset.k===store));[...tb.children].forEach(b=>b.classList.toggle('on',b.textContent===per));
  const d=D[store],a=PER[per].from,pp=d.P.slice(a);
  chart.data.labels=L.slice(a);chart.data.datasets[0].data=d.R.slice(a);chart.data.datasets[1].data=d.S.slice(a);chart.data.datasets[2].data=pp;
  chart.data.datasets[2].backgroundColor=pp.map(v=>v<0?RD:GR);chart.data.datasets.forEach(x=>x.maxBarThickness=a===6?48:22);chart.update();
  const r=sum(d.R,a),sp=sum(d.S,a),pr=sum(d.P,a);
  document.getElementById('sumh').textContent='Sammanfattning · '+NAME[store]+' · '+PER[per].label;
  document.getElementById('sum').innerHTML=`<div class="k"><p class="kl">Vinst</p><p class="kv ${cls(pr)}">${sg(pr)}${f(pr)} kr</p><p class="ks">${pc(pr/r*100)} av oms.</p></div><div class="k"><p class="kl">Omsättning</p><p class="kv">${f(r)}</p></div><div class="k"><p class="kl">Annonskostnad</p><p class="kv">${f(sp)}</p></div><div class="k"><p class="kl">ROAS</p><p class="kv">${ro(r,sp)}</p></div>`;
  document.getElementById('split').innerHTML=store!=='ALLA'?'':'<p class="sec">Per butik · '+PER[per].label+'</p><table><colgroup><col style="width:28%"><col><col><col><col><col class="hide-sm"></colgroup><thead><tr><th>Butik</th><th>Oms.</th><th>Spend</th><th>ROAS</th><th>Vinst</th><th class="hide-sm">Vinst %</th></tr></thead><tbody>'+codes.map(c=>{const R=sum(D[c].R,a),S=sum(D[c].S,a),P=sum(D[c].P,a);return `<tr><td>${esc(NAME[c])}</td><td>${f(R)}</td><td>${f(S)}</td><td>${ro(R,S)}</td><td class="${cls(P)}">${sg(P)}${f(P)}</td><td class="${cls(P)} hide-sm">${pc(P/R*100)}</td></tr>`}).join('')+'</tbody></table>';
  const rows=d.top[per]||[];
  document.getElementById('tbody').innerHTML=rows.map(x=>`<tr><td title="${esc(x[0])}">${esc(x[0])}</td><td>${f(x[1])}</td><td class="hide-sm">${sp?Math.round(x[1]/sp*100):0} %</td><td>${f(x[2])}</td><td>${ro(x[2],x[1])}</td><td class="${cls(x[3])}">${sg(x[3])}${f(x[3])}</td></tr>`).join('')+(rows.length?`<tr><td class="dim">Topp 5 av total</td><td colspan="5" class="dim">${sp?Math.round(rows.reduce((q,x)=>q+x[1],0)/sp*100):0} % av ${f(sp)} kr</td></tr>`:'<tr><td colspan="6" class="dim">Ingen annonsspend i perioden</td></tr>');
  document.getElementById('foot').textContent='DKK, NOK och EUR omräknade med Riksbankens dagskurs. Omsättning = nettoomsättning. Vinst per annons = Juicys bruttovinst minus spend (före transaktionsavgifter). Annonsnamn exakt som i Meta.';
}
['ALLA',...codes].forEach(k=>{const b=document.createElement('button');b.textContent=NAME[k];b.dataset.k=k;b.onclick=()=>{store=k;render()};st.appendChild(b)});
Object.keys(PER).forEach(k=>{const b=document.createElement('button');b.textContent=k;b.onclick=()=>{per=k;render()};tb.appendChild(b)});
render();
</script>
</body>
</html>
